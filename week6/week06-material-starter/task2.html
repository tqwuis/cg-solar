<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>실습 2 · 빙각의 궤도</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="demo.css">
  <style>
    .wrap { grid-template-columns: minmax(0,1fr) 20rem; height: 100dvh; }
    .stage { display: block; background: #080e1b; }
    .stage canvas { position: absolute; inset: 0; touch-action: none; }
    .telemetry { position: absolute; left: 24px; bottom: 20px; color: #b6c4d4;
      font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }
    .panel { padding: 30px 24px; }
    .panel h1 { margin: 0; font-size: 27px; letter-spacing: -.06em; }
    .panel .sub { margin: 6px 0 0; font-size: 13px; }
    .panel section { border-top: 1px solid var(--d-line); margin-top: 22px; padding-top: 17px; }
    .panel h2 { margin: 0 0 12px; font-size: 15px; color: var(--d-ink); }
    .ctl { margin-bottom: 14px; }
    .ctl label { font-size: 13px; }
    .ctl output { color: var(--d-accent); font-variant-numeric: tabular-nums; }
    .ctl select, button { font: inherit; font-size: 13px; padding: 8px; }
    button { background: var(--d-bg-soft); color: var(--d-ink); border: 1px solid var(--d-line-strong);
      border-radius: 5px; cursor: pointer; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .hint, #status { margin: 6px 0 0; color: var(--d-muted); font-size: 12px; }
    @media (max-width: 760px) {
      .wrap { display: block; height: auto; }
      .stage { height: 54vh; height: 54svh; min-height: 275px; }
      .panel { max-height: none; padding: 18px 20px; }
      .telemetry { left: 12px; bottom: 8px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="stage">
      <canvas id="cv" aria-label="고정된 태양과 타원 궤도를 도는 얼음행성 빙각"></canvas>
      <div class="telemetry">태양까지의 거리 <span id="distance">–</span> · 장면 단위</div>
    </div>
    <aside class="panel">
      <h1>빙각의 궤도</h1>
      <p class="sub">실습 2 · 얼음행성의 표면 재질</p>
      <section>
        <h2>환경 조건</h2>
        <div class="ctl">
          <label for="solar">태양 활동 <output id="solarValue" for="solar">65%</output></label>
          <input id="solar" type="range" min="0" max="100" value="65">
          <p class="hint">태양에 가까워지면 빙판 사이로 짙은 물이 드러나고, 멀어지면 다시 얼어붙습니다.</p>
        </div>
        <div class="ctl">
          <label for="pressure">빙각 내부 압력 <output id="pressureValue" for="pressure">45%</output></label>
          <input id="pressure" type="range" min="0" max="100" value="45">
          <p class="hint">얼음판이 갈라지며 청록색 염수가 드러납니다.</p>
        </div>
      </section>
      <section>
        <h2>관측</h2>
        <div class="ctl">
          <label for="surface">표면 표시</label>
          <select id="surface">
            <option value="0">변화한 표면</option><option value="1">기본 표면</option>
            <option value="2">해빙 마스크</option><option value="3">균열 마스크</option>
          </select>
        </div>
        <div class="ctl">
          <label for="camera">시점</label>
          <select id="camera"><option value="system">전체 궤도</option><option value="planet">행성 확대</option></select>
        </div>
        <div class="ctl">
          <div class="actions" role="group" aria-label="공전 거리 비교">
            <button id="perihelion" type="button">근일점 보기</button>
            <button id="aphelion" type="button">원일점 보기</button>
          </div>
          <p class="hint">공전을 멈추고 같은 빙판을 가장 가까운 거리와 가장 먼 거리에서 비교합니다.</p>
        </div>
        <div class="actions"><button id="pause" type="button">일시 정지</button><button id="reset" type="button">시점 초기화</button></div>
        <p class="hint">드래그로 회전하고 휠로 확대합니다. 일시 정지하면 같은 위치에서 재질을 비교할 수 있습니다.</p>
      </section>
      <p id="status" role="status">재질 맵을 불러오는 중…</p>
    </aside>
  </main>
  <script src="demo.js"></script>
  <script src="task2.js"></script>
</body>
</html>
